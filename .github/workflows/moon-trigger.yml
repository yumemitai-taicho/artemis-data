name: Artemis Moon — trigger private calculation
on:
  push:
    branches: [main]
    paths:
      - numbers3.csv
      - numbers4.csv
      - lottery-meta.json
  workflow_dispatch:

# Public bridge only: no proprietary calculation code in this repository.
permissions:
  contents: read
concurrency:
  group: artemis-moon-trigger
  cancel-in-progress: false
jobs:
  request-calc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch to private calculation repository
        env:
          PRIVATE_DISPATCH_TOKEN: ${{ secrets.MOON_PRIVATE_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_DISPATCH_TOKEN" ]; then
            echo 'MOON_PRIVATE_DISPATCH_TOKEN is missing. Dispatch not sent.' >&2
            exit 1
          fi
          printf '{"event_type":"artemis_draw_update","client_payload":{"source_sha":"%s"}}' "$SOURCE_SHA" > /tmp/dispatch.json
          code=$(curl --silent --show-error --location --output /tmp/response.json --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${PRIVATE_DISPATCH_TOKEN}" \
            --data-binary @/tmp/dispatch.json \
            'https://api.github.com/repos/yumemitai-taicho/artemis-moon-calc/dispatches')
          if [ "$code" != 204 ]; then
            echo "Private dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo "Private calculation requested for public data commit ${SOURCE_SHA}"
