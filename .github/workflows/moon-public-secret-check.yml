name: Artemis Moon PUBLIC - safe token access check
on:
  push:
    branches:
      - moon-auto-prep-20261119
permissions:
  contents: read
jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify configured token can read its destination (no dispatch or writes)
        env:
          TARGET_TOKEN: ${{ secrets.MOON_PRIVATE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_TOKEN" ]; then echo 'Required secret is missing'; exit 1; fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 2 --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            'https://api.github.com/repos/yumemitai-taicho/artemis-moon-calc')
          if [ "$status" != '200' ]; then echo "Target permission check failed: HTTP ${status}"; exit 1; fi
          echo 'Cross-repository token is present and target repository is reachable.'
