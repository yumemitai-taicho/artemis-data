name: Artemis Shadow — trigger private calculation
on:
  push:
    branches: [main]
    paths:
      - numbers3.csv
      - numbers4.csv
      - lottery-meta.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artemis-shadow-trigger
  cancel-in-progress: false
jobs:
  request-calc:
    # Keep automatic triggers disabled until the new pipeline is verified.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SHADOW_AUTO_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch only to private shadow repository
        env:
          PRIVATE_DISPATCH_TOKEN: ${{ secrets.SHADOW_PRIVATE_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_DISPATCH_TOKEN" ]; then
            echo 'SHADOW_PRIVATE_DISPATCH_TOKEN is missing; no dispatch sent.' >&2
            exit 1
          fi
          printf '{"event_type":"artemis_shadow_draw_update","client_payload":{"source_sha":"%s"}}' "$SOURCE_SHA" > /tmp/shadow-dispatch.json
          code=$(curl --silent --show-error --output /tmp/shadow-response.json --write-out '%{http_code}' --retry 3 --retry-all-errors --max-time 30 \
            -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${PRIVATE_DISPATCH_TOKEN}" --data-binary @/tmp/shadow-dispatch.json \
            'https://api.github.com/repos/yumemitai-taicho/artemis-shadow-calc/dispatches')
          if [ "$code" != 204 ]; then
            echo "Shadow dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo "Shadow calculation requested for source $SOURCE_SHA"
